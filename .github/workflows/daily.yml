name: Daily Strava Report

on:
  schedule:
    # Target: 21:00 Limassol (UTC+3) = 18:00 UTC
    # GitHub Actions can delay cron by several hours under load.
    # Observed actual execution: ~22:00 UTC (01:00 Limassol).
    # Setting cron to 10:00 UTC so that even with 8h delay = 18:00 UTC = 21:00 Limassol
    - cron: '0 10 * * *'
  workflow_dispatch:
    # Allow manual run from GitHub UI

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Strava bot
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
